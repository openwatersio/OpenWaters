name: CLA

on:
  workflow_run:
    workflows: [CLA trigger]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Reports a `cla` commit status on the pull request's head; this job's own check lands on main.
  check:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.actor.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, 'CLA') || contains(github.event.comment.body, 'recheck')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # This privileged workflow must never check out or execute pull-request code.
      - name: Create signature writer token
        id: cla-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-single-file: write
      - uses: openwatersio/cla-github-action@82b776f1896ffd2631594b92ea124e173609e496 # Open Waters fork
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.cla-token.outputs.token }}
        with:
          # The open pull request whose head is this commit is checked; nothing from the triggering run is trusted.
          head-sha: ${{ github.event.workflow_run.head_sha }}
          status-context: cla
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          path-to-signatures: ".cla.json"
          branch: "main"
          # Explicit repository inputs select the App token for signature storage only.
          remote-organization-name: ${{ github.repository_owner }}
          remote-repository-name: ${{ github.event.repository.name }}
          allowlist: "*[bot],noreply@anthropic.com"
          lock-pullrequest-aftermerge: "false"
          custom-notsigned-prcomment: |
            Thank you for this pull request! Before we can accept your contribution, you need to sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md). [Read more about why this is necessary.](https://github.com/${{ github.repository }}/blob/main/docs/licensing.md)

            To sign, please reply to this comment with:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
