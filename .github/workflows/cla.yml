name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  cla:
    # Dependabot-triggered runs cannot access the App secret; human updates and rechecks still run.
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        (contains(github.event.comment.body, 'CLA') || contains(github.event.comment.body, 'recheck'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      # This privileged workflow must never check out or execute pull-request code.
      - name: Create signature writer token
        id: cla-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-single-file: write
      - uses: openwatersio/cla-github-action@599be7e585704b7eb53be7498aebefc0e7d8caac # Open Waters fork
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.cla-token.outputs.token }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          path-to-signatures: ".cla.json"
          branch: "main"
          # Explicit repository inputs select the App token for signature storage only.
          remote-organization-name: ${{ github.repository_owner }}
          remote-repository-name: ${{ github.event.repository.name }}
          allowlist: "*[bot],noreply@anthropic.com"
          lock-pullrequest-aftermerge: "false"
          custom-notsigned-prcomment: |
            Thank you for this pull request! Before we can accept your contribution, you need to sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md). [Read more about why this is necessary.](https://github.com/${{ github.repository }}/blob/main/docs/licensing.md)

            To sign, please reply to this comment with:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
