name: CLA trigger

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  # Its completion starts the CLA workflow, which checks the pull request with the signature App.
  # Not named `cla`: a check with that name here would satisfy the required `cla` status.
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "The CLA workflow checks this pull request when this run completes."
